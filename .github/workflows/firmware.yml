# Builds the ButterBot firmware on every push / PR, and publishes a GitHub release with a single
# merged full-flash image when a version tag (v*) is pushed. That image is exactly what
# Dimension Hopper (tools/updater) downloads for "Latest GitHub release".
name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and merge image (ESP-IDF v5.5.3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          # merge-bin writes build/ButterBot-merged.bin: bootloader, partitions, app, SPIFFS and all models,
          # one file flashed at 0x0 (same layout as the official CircuitMess releases)
          command: idf.py build && idf.py merge-bin -o ButterBot-merged.bin

      - name: Name the image
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME}"; else VER="$(git rev-parse --short HEAD)"; fi
          OUT="ButterBot-${VER}.bin"
          sudo cp build/ButterBot-merged.bin "$OUT"
          sudo chown "$(id -u):$(id -g)" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
          generate_release_notes: true
          body: |
            Flash with **Dimension Hopper** (`DimensionHopper.exe`, attached below): pick "Latest GitHub release" and this repository.
            Or manually: `esptool.py -c esp32s3 -b 921600 -p <PORT> write_flash 0 ${{ steps.name.outputs.file }}`

  # Dimension Hopper: the Windows app, built on a Windows runner and attached to the same release
  hopper:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build DimensionHopper.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/updater/build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DimensionHopper.exe
          path: tools/updater/dist/DimensionHopper.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/updater/dist/DimensionHopper.exe
